<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Feaugon — ideias em movimento</title>
  <desc id="desc">Banner azul escuro com tipografia branca, detalhes menta e lilás e uma órbita geométrica. Python, curiosidade e construção.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1b2845"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#63dec3"/><stop offset="1" stop-color="#c0a1ff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>
